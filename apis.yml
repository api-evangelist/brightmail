name: Brightmail
description: Brightmail was an email anti-spam software company founded in 1998 by Sunil Paul, best
  known for its network of "spam probe" honeypot email addresses that fed real-time anti-spam
  filtering rules to enterprise mail servers. Symantec acquired Brightmail in 2004 for roughly $370
  million, and the technology shipped for years as Symantec Brightmail AntiSpam and later Symantec
  Mail Security; Symantec's enterprise security business was subsequently acquired by Broadcom in
  2019. Brightmail today is a defunct brand with no independent developer program or public API
  surface — www.brightmail.com redirects to broadcom.com and the brightmail.com apex domain no longer
  resolves. This profile is retained for historical/network completeness rather than active API
  enrichment.
